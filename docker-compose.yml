version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-bot-api
    ports:
      - "5000:5000"
    environment:
      # API Configuration
      - API_HOST=0.0.0.0
      - API_PORT=5000
      - API_ENV=${API_ENV:-development}

      # CORS Configuration
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3005,http://localhost:3000}
      - ALLOWED_CREDENTIALS=true

      # Database Configuration
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}

      # JWT Configuration
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRATION_DAYS=${JWT_EXPIRATION_DAYS:-7}

      # Encryption Configuration
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}

      # Firebase Configuration
      - FIREBASE_CREDENTIALS_PATH=${FIREBASE_CREDENTIALS_PATH:-}
      - FIREBASE_CREDENTIALS_JSON=${FIREBASE_CREDENTIALS_JSON:-}

      # Rate Limiting
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-100}
      - RATE_LIMIT_PERIOD=${RATE_LIMIT_PERIOD:-900}

    volumes:
      # Mount Firebase credentials if using file
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
      # Mount app code for development (comment out in production)
      - ./app:/app/app

    restart: unless-stopped

    networks:
      - trading-bot-network

    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  trading-bot-network:
    driver: bridge

